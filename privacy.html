<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>隐私声明 · 纸间气球</title>
<style>
  :root{--paper:#f4f0e6;--ink:#26221c;--dim:#7d766a;--faint:#a9a193;--line:rgba(38,34,28,.16)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--paper);color:var(--ink);font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-weight:300;line-height:2}
  .col{max-width:680px;margin:0 auto;padding:64px 24px}
  .overline{font-size:10px;letter-spacing:.56em;color:var(--faint);margin-bottom:16px}
  h1{font-family:Georgia,"Songti SC","SimSun",serif;font-weight:400;font-size:34px;letter-spacing:.2em;margin-bottom:8px}
  .rule{width:56px;height:1px;background:var(--line);margin:28px 0}
  h2{font-size:15px;font-weight:600;letter-spacing:.12em;margin:28px 0 6px}
  p{font-size:14px;color:var(--dim)}
  b{font-weight:600;color:var(--ink)}
  .foot{margin-top:48px;font-size:12px;color:var(--faint);letter-spacing:.14em}
  .back{display:block;margin:44px auto 0;border:1px solid var(--line);background:transparent;color:var(--dim);
    font-family:inherit;font-weight:300;font-size:13px;letter-spacing:.5em;text-indent:.5em;padding:13px 40px;
    cursor:pointer;transition:color .25s ease,border-color .25s ease}
  .back:hover{color:var(--ink);border-color:var(--dim)}
</style>
</head>
<body>
<div class="col">
  <div class="overline">隐私声明</div>
  <h1>纸间气球</h1>
  <div class="rule"></div>
  <h2>一句话</h2>
  <p>本游戏<b>不收集、不上传、不共享任何个人数据</b>。</p>
  <h2>具体说明</h2>
  <p>游戏完全在您的设备本地运行，没有服务器、没有账号系统、没有统计、没有广告组件。您的最高分、署名、声音与模式偏好仅保存在本机浏览器的本地存储中，用于在您下次打开游戏时恢复，<b>不会离开您的设备</b>。</p>
  <h2>权限</h2>
  <p>游戏不请求任何设备权限。仅当您手动点击全屏按钮时，才会使用浏览器的全屏功能。</p>
  <h2>儿童</h2>
  <p>本游戏适合所有年龄段，无任何不适宜内容。</p>
  <h2>联系</h2>
  <p>如有疑问，请通过 GitHub 仓库的 Issues 页面联系开发者 PCWJ08 。</p>
  <div class="foot">2026 年 · 纸间工坊 | 未登录 · 亲署</div>
  <button class="back" id="backBtn">返 回 游 戏</button>
</div>
<script>
  (function () {
    var b = document.getElementById('backBtn');
    b.addEventListener('click', function () {
      // 同标签页存在历史记录时回退（bfcache 可完整还原离开前的现场），否则直链回首页
      if (document.referrer && history.length > 1) history.back();
      else location.href = 'index.html';
    });
  })();
</script>
</body>
</html>
